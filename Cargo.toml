[package]
name = "ci-batch-scheduler"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An online CI batch scheduler with explicit deadlines and bounded planning"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
